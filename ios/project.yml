name: tiger-iptv
options:
  bundleIdPrefix: com.tigeriptv
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    GCC_PREPROCESSOR_DEFINITIONS: $(inherited) GLES_SILENCE_DEPRECATION=1
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PM27C7JC3M
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "2"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    branch: master
  GRDBQuery:
    url: https://github.com/groue/GRDBQuery.git
    from: 0.11.0
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: 13.0.1

schemes:
  tiger-iptv:
    build:
      targets:
        tiger-iptv: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  tiger-iptv:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # تطبيق واحد متعدد المنصات: iPhone + iPad + Mac + Apple TV + Vision Pro
    supportedDestinations: [iOS, iPadOS, tvOS, macOS, visionOS]
    sources:
      - path: tiger-iptv
        excludes:
          - "scripts/**"
    resources:
      - path: tiger-iptv/Assets.xcassets
        optional: true
    info:
      path: App-Info.plist
      properties:
        CFBundleDisplayName: Tiger iptv
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "30"
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~vision:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        NSUserActivityTypes:
          - com.tigeriptv.app.watch
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: "TIGER IPTV uses the camera only to scan a QR code that contains your subscription link."
        NSPhotoLibraryUsageDescription: "TIGER IPTV can read a QR code from a photo in your library to import your subscription."
        NSLocalNetworkUsageDescription: "TIGER IPTV connects to IPTV servers on your local network when your provider is hosted there."
        CFBundleLocalizations:
          - en
          - tr
          - ar
          - de
          - es
          - fr
          - hi
          - pt
          - ru
          - zh
        CFBundleURLTypes:
          - CFBundleURLName: com.tigeriptv.app
            CFBundleURLSchemes:
              - tigeriptv
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconGold:
              CFBundleIconFiles:
                - AppIconGold
              UIPrerenderedIcon: false
            AppIconDark:
              CFBundleIconFiles:
                - AppIconDark
              UIPrerenderedIcon: false
            AppIconLight:
              CFBundleIconFiles:
                - AppIconLight
              UIPrerenderedIcon: false
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.tigeriptv.app.quick.addPlaylist
            UIApplicationShortcutItemTitle: Add Subscription
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: com.tigeriptv.app.quick.search
            UIApplicationShortcutItemTitle: Search
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeSearch
          - UIApplicationShortcutItemType: com.tigeriptv.app.quick.favorites
            UIApplicationShortcutItemTitle: Favorites
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeFavorite
          - UIApplicationShortcutItemType: com.tigeriptv.app.quick.downloads
            UIApplicationShortcutItemTitle: Downloads
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeDownload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tigeriptv.app
        PRODUCT_NAME: Tiger iptv
        PRODUCT_MODULE_NAME: TigerIPTV
        DEVELOPMENT_TEAM: PM27C7JC3M
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2,3,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MAC_CATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MACOS: YES
        SUPPORTS_TVOS: YES
        SUPPORTS_VISIONOS: YES
        SUPPORTS_IPHONEOS: YES
        SUPPORTS_IPADOS: YES
        SWIFT_OBJC_BRIDGING_HEADER: tiger-iptv/Tiger-IPTV-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/mpv-headers
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/libmpv/LinkStaging/$(PLATFORM_NAME)
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Mpv
    dependencies:
      - package: GRDB
        product: GRDB
      - package: GRDBQuery
        product: GRDBQuery
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    preBuildScripts:
      - name: Prepare libmpv link paths
        script: |
          exec "${SRCROOT}/tiger-iptv/scripts/prepare_libmpv_link_paths.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed libmpv frameworks
        script: |
          exec "${SRCROOT}/tiger-iptv/scripts/embed_libmpv_frameworks.sh"
        basedOnDependencyAnalysis: false
